<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #0e0d18;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  color: #f0f0f0;
  overflow-x: hidden;
}
body.ar { font-family: 'Cairo', sans-serif; }

/* ── Animated BG ── */
.bg-layer {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}

/* Deep radial vignette like the image */
.bg-layer::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(120,40,10,0.35) 0%, transparent 70%),
    radial-gradient(ellipse 80% 60% at 20% 80%, rgba(80,20,120,0.3) 0%, transparent 65%),
    radial-gradient(ellipse 60% 50% at 80% 60%, rgba(30,20,100,0.25) 0%, transparent 60%);
}

.orb {
  position: absolute; border-radius: 50%;
  filter: blur(100px); opacity: 0.12;
  animation: driftOrb ease-in-out infinite alternate;
}
.o1 { width:450px;height:450px;background:#8b2fc9;top:-80px;left:-100px;animation-duration:16s; }
.o2 { width:320px;height:320px;background:#c85000;top:0;right:-60px;animation-duration:12s;animation-delay:-4s; }
.o3 { width:280px;height:280px;background:#1a3a9c;bottom:10%;left:-40px;animation-duration:18s;animation-delay:-8s; }
.o4 { width:200px;height:200px;background:#7c1a6e;bottom:5%;right:10%;animation-duration:10s;animation-delay:-2s; }
@keyframes driftOrb {
  from { transform:translate(0,0) scale(1); }
  to   { transform:translate(35px,28px) scale(1.08); }
}

/* Particles */
.p { position:absolute; border-radius:50%; background:rgba(255,255,255,0.4); animation:floatP linear infinite; }
@keyframes floatP {
  0%  { transform:translateY(0); opacity:0; }
  8%  { opacity:0.8; }
  92% { opacity:0.2; }
  100%{ transform:translateY(-100vh); opacity:0; }
}

/* Spinning rings */
.ring {
  position: absolute; border-radius:50%;
  animation: spinRing linear infinite;
}
.ring1 { width:360px;height:360px;border:1px solid rgba(150,60,220,0.08);top:0;left:-100px;animation-duration:40s; }
.ring2 { width:580px;height:580px;border:1px solid rgba(60,100,220,0.06);bottom:-100px;right:-150px;animation-duration:60s;animation-direction:reverse; }
@keyframes spinRing { to { transform:rotate(360deg); } }

/* ── Layout ── */
.page {
  position: relative; z-index:10;
  max-width: 460px; margin: 0 auto;
  padding: 30px 22px 70px;
  display: flex; flex-direction: column; align-items: center;
}

/* ── Lang Toggle ── */
.lang-toggle {
  align-self: flex-end;
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: #888;
  font-size: 12px; font-weight: 600;
  padding: 6px 14px; border-radius: 20px;
  cursor: pointer; transition: all 0.3s;
  margin-bottom: 20px;
  letter-spacing: 0.4px;
  font-family: inherit;
}
.lang-toggle svg { width:13px;height:13px;fill:#888;transition:fill 0.3s; }
.lang-toggle:hover { background:rgba(180,100,255,0.12); border-color:rgba(180,100,255,0.4); color:#ddd; }
.lang-toggle:hover svg { fill:#ddd; }

/* ── Avatar ── */
.avatar-wrap {
  position: relative;
  width: 148px; height: 148px;
  margin-bottom: 20px;
  animation: popIn 0.8s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn {
  from { opacity:0; transform:scale(0.7) translateY(-20px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}

/* Warm orange glow underneath — matching the image */
.avatar-warm-glow {
  position: absolute; inset: -12px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(220,120,20,0.75) 0%, rgba(180,60,10,0.4) 40%, transparent 70%);
  filter: blur(14px);
  animation: warmPulse 3s ease-in-out infinite;
  z-index: 0;
}
@keyframes warmPulse {
  0%,100% { opacity:0.7; transform:scale(1); }
  50%      { opacity:1;   transform:scale(1.06); }
}

/* Spinning conic border */
.avatar-spin {
  position: absolute; inset: -4px; border-radius: 50%; z-index: 1;
  background: conic-gradient(from 0deg, #ff8c00, #ff4500, #9b30ff, #4060ff, #ff8c00);
  animation: spinRing 5s linear infinite;
}
.avatar-spin::after {
  content:''; position:absolute; inset:3px;
  background: #0e0d18; border-radius:50%;
}

/* Inner dark ring like the image */
.avatar-dark-ring {
  position: absolute; inset: -2px; border-radius: 50%; z-index: 2;
  border: 3px solid #1a1828;
}

.avatar-img {
  position: relative; z-index: 3;
  width: 100%; height: 100%; border-radius: 50%;
  background: #1e1b30;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.avatar-img img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.avatar-ph { font-size:11px; color:#444; text-align:center; line-height:1.6; padding:10px; }

/* ── Name ── */
.profile-name {
  font-size: 36px; font-weight: 800;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(110deg, #ff7a20 0%, #ff5500 25%, #d060ff 60%, #a855f7 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  text-align: center; margin-bottom: 8px;
  letter-spacing: -0.5px;
  animation: fadeUp 0.7s 0.25s ease both;
}
body.ar .profile-name { font-family: 'Tajawal', sans-serif; font-weight:900; font-size:32px; }

/* ── Bio ── */
.profile-bio {
  color: #8a8aaa;
  font-size: 14.5px; font-weight: 400;
  text-align: center; margin-bottom: 40px;
  letter-spacing: 0.2px;
  animation: fadeUp 0.7s 0.38s ease both;
}
body.ar .profile-bio { font-size:14px; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(22px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── Cards ── */
.cards { width:100%; display:flex; flex-direction:column; gap:14px; }

.card {
  display: flex; align-items: center; gap: 15px;
  background: #12111e;
  border-radius: 18px;
  padding: 16px 18px;
  cursor: pointer; text-decoration: none; color: inherit;
  position: relative; overflow: hidden;
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s;
  animation: fadeUp 0.6s ease both;
  /* Colored border glow — key to matching the image */
  border: 1.5px solid transparent;
}
.card::before {
  content: '';
  position: absolute; inset: 0; border-radius: 18px;
  padding: 1.5px;
  background: var(--border-grad);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  pointer-events: none;
}

/* Shimmer */
.card::after {
  content:''; position:absolute;
  top:0; left:-130%; width:55%; height:100%;
  background: linear-gradient(90deg,transparent,rgba(255,255,255,0.045),transparent);
  transition:left 0.6s; pointer-events:none;
}
.card:hover::after { left:160%; }
.card:hover { transform:translateY(-4px) scale(1.015); }
.card:active { transform:scale(0.975); }

/* Card animation delays */
.card:nth-child(1){animation-delay:0.45s}
.card:nth-child(2){animation-delay:0.55s}
.card:nth-child(3){animation-delay:0.65s}
.card:nth-child(4){animation-delay:0.75s}
.card:nth-child(5){animation-delay:0.85s}

/* Exact border gradients from the image */
.card.yt  { --border-grad: linear-gradient(135deg, rgba(220,50,50,0.7), rgba(120,0,80,0.4), rgba(80,0,120,0.5)); }
.card.ig  { --border-grad: linear-gradient(135deg, rgba(220,100,30,0.7), rgba(180,50,10,0.4), rgba(100,20,100,0.4)); }
.card.tt  { --border-grad: linear-gradient(135deg, rgba(120,60,220,0.7), rgba(80,30,180,0.4), rgba(50,20,100,0.4)); }
.card.fb  { --border-grad: linear-gradient(135deg, rgba(50,80,220,0.7), rgba(20,50,160,0.4), rgba(40,10,100,0.4)); }
.card.tg  { --border-grad: linear-gradient(135deg, rgba(0,136,204,0.7), rgba(0,80,140,0.4), rgba(20,20,100,0.4)); }

.card:hover.yt  { box-shadow: 0 0 30px rgba(220,50,50,0.18), 0 10px 30px rgba(0,0,0,0.5); }
.card:hover.ig  { box-shadow: 0 0 30px rgba(220,100,30,0.18), 0 10px 30px rgba(0,0,0,0.5); }
.card:hover.tt  { box-shadow: 0 0 30px rgba(140,70,240,0.18), 0 10px 30px rgba(0,0,0,0.5); }
.card:hover.fb  { box-shadow: 0 0 30px rgba(50,100,240,0.18), 0 10px 30px rgba(0,0,0,0.5); }
.card:hover.tg  { box-shadow: 0 0 30px rgba(0,136,204,0.18), 0 10px 30px rgba(0,0,0,0.5); }

/* Icon box */
.icon-box {
  width: 52px; height: 52px; border-radius: 14px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
}
.card:hover .icon-box { transform: rotate(-7deg) scale(1.12); }

.card.yt .icon-box { background: linear-gradient(145deg, #ff2020, #aa0000); }
.card.ig .icon-box { background: linear-gradient(145deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
.card.tt .icon-box { background: linear-gradient(145deg, #7c3aed, #5b21b6); }
.card.fb .icon-box { background: linear-gradient(145deg, #1877f2, #0a4fa8); }
.card.tg .icon-box { background: linear-gradient(145deg, #0088cc, #005f8a); }

.icon-box svg { width:26px; height:26px; fill:white; }

.card-info { flex:1; min-width:0; }
.card-title { font-size:17px; font-weight:700; margin-bottom:4px; letter-spacing:-0.2px; }
.card-sub   { color:#6a6a8a; font-size:13px; line-height:1.45; }

.arrow {
  color: #4a4a6a; font-size:22px; flex-shrink:0;
  transition: color 0.3s, transform 0.3s;
  font-weight: 300;
}
.card.yt:hover  .arrow { color:#ff4040; transform:translateX(3px); }
.card.ig:hover  .arrow { color:#f09433; transform:translateX(3px); }
.card.tt:hover  .arrow { color:#9f6fff; transform:translateX(3px); }
.card.fb:hover  .arrow { color:#4a9eff; transform:translateX(3px); }
.card.tg:hover  .arrow { color:#0af; transform:translateX(3px); }

body.ar .card:hover .arrow { transform:translateX(-3px) !important; }

/* ── Share ── */
.share-wrap {
  width:100%; margin-top:38px;
  animation: fadeUp 0.7s 1s ease both;
}

.share-btn {
  width:100%;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding:15px 20px;
  color: #aaa; font-family: inherit;
  font-size:15px; font-weight:600;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:10px;
  transition:all 0.3s; backdrop-filter:blur(16px);
  position:relative; overflow:hidden;
}
.share-btn::before {
  content:''; position:absolute; inset:0;
  background: linear-gradient(135deg,rgba(150,60,220,0.12),rgba(50,80,220,0.12));
  opacity:0; transition:opacity 0.3s;
}
.share-btn:hover::before { opacity:1; }
.share-btn:hover { border-color:rgba(170,80,255,0.45); color:#fff; box-shadow:0 8px 30px rgba(120,40,220,0.18); }
.share-btn svg { width:17px;height:17px;fill:#aaa;transition:fill 0.3s; flex-shrink:0; }
.share-btn:hover svg { fill:#fff; }
.share-btn:active { transform:scale(0.98); }

/* ── Toast ── */
.toast {
  position:fixed; bottom:30px; left:50%;
  transform: translateX(-50%) translateY(55px);
  background: rgba(110,40,200,0.93);
  color:#fff; padding:11px 28px;
  border-radius:30px; font-size:14px; font-weight:700;
  z-index:999; opacity:0; pointer-events:none;
  transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.4s;
  backdrop-filter:blur(16px); white-space:nowrap;
}
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>

  <div class="cards">

<script>
  /* ── Particles ── */
  const bgEl = document.querySelector('.bg-layer');
  for(let i=0;i<32;i++){
    const d=document.createElement('div');
    d.className='p';
    const sz=Math.random()*2.2+0.8;
    d.style.cssText=`left:${Math.random()*100}%;bottom:-4%;width:${sz}px;height:${sz}px;animation-duration:${Math.random()*16+9}s;animation-delay:${Math.random()*14}s;`;
    bgEl.appendChild(d);
  }

  /* ── Photo ── */
  /* ↓ Put your photo URL between the quotes below ↓ */
  const PHOTO_URL = '';
  if(PHOTO_URL){
    const box=document.getElementById('avatarBox');
    box.innerHTML=`<img src="${PHOTO_URL}" alt="profile photo">`;
  }

  /* ── Share URL ── */
  /* ↓ Put your page URL between the quotes below ↓ */
  const PAGE_URL = 'YOUR-PAGE-URL-HERE';

  function doShare(){
    if(navigator.share){
      navigator.share({title:document.getElementById('profileName').textContent,url:PAGE_URL}).catch(()=>{});
    } else {
      navigator.clipboard.writeText(PAGE_URL).then(()=>{
        const t=document.getElementById('toast');
        t.textContent = isAr ? 'تم نسخ الرابط' : 'Link copied!';
        t.classList.add('show');
        setTimeout(()=>t.classList.remove('show'),2500);
      });
    }
  }

  /* ── Language ── */
  let isAr = false; // starts in English

  function toggleLang(){
    isAr = !isAr;
    const lang = isAr ? 'ar' : 'en';
    document.documentElement.lang = lang;
    document.documentElement.dir = isAr ? 'rtl' : 'ltr';
    document.body.classList.toggle('ar', isAr);

    document.getElementById('langLabel').textContent = isAr ? 'English' : 'عربي';

    document.querySelectorAll('[data-en]').forEach(el => {
      el.textContent = el.getAttribute('data-' + lang);
    });

    document.querySelectorAll('.arrow').forEach(a => {
      a.textContent = isAr ? '‹' : '›';
    });

    document.getElementById('shareTxt').textContent = isAr ? 'مشاركة الصفحة' : 'Share Page';

    const ph = document.getElementById('avatarPh');
    if(ph) ph.innerHTML = isAr ? 'ضع رابط<br>الصورة هنا' : 'Put photo<br>URL here';
  }
</script>
</body>
</html>
